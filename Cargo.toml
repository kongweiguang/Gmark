# @author kongweiguang

[package]
name = "gmark"
version = "0.2.6"
edition = "2024"
rust-version = "1.95"
authors = ["kongweiguang"]
repository = "https://github.com/kongweiguang/gmark"
license = "GPL-3.0-or-later"

[workspace]
members = [
    ".",
    "crates/gmark-document-core",
    "crates/gmark-document",
    "crates/gmark-document-runtime",
    "crates/gmark-config",
    "crates/gmark-export",
    "crates/gmark-fuzz-support",
    "crates/gmark-i18n",
    "crates/gmark-json-graph",
    "crates/gmark-markdown",
    "crates/gmark-math-edit",
    "crates/gmark-paged-document",
    "crates/gmark-recovery-codec",
    "crates/gmark-source-tools",
    "crates/gmark-update-core",
    "xtask",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["kongweiguang"]
repository = "https://github.com/kongweiguang/gmark"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
# 主包平台桥需要少量经审计的原生调用；默认拒绝 unsafe，仅允许源码中的窄作用域例外。
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Allow stylistic patterns the project doesn't enforce. These mirror the
# spirit of gpui-component's workspace lints — categorically silence
# noise (range-loop indexing, identical-block flagging, helper-arg
# counts, "future detached via let _") while keeping real correctness
# lints active.
if_same_then_else = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
let_underscore_future = "allow"
manual_div_ceil = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
module_inception = "allow"
obfuscated_if_else = "allow"
question_mark = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

[features]
updater-e2e = ["gmark-update-core/updater-e2e"]
default = [
    "code-highlight-core",
    "code-highlight-official",
    "code-highlight-config",
    "code-highlight-extra",
    "html-native",
    "native-html-render",
]
code-highlight-core = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "gmark-export/code-highlight-core",
    "gmark-source-tools/code-highlight-core",
]
html-native = [
    "dep:tree-sitter",
    "dep:tree-sitter-html",
    "gmark-export/html-native",
    "gmark-markdown/html-native",
    "native-html-render",
]
native-html-render = []
code-highlight-official = [
    "code-highlight-core",
    "gmark-export/code-highlight-official",
    "gmark-source-tools/code-highlight-official",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-md",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-java",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
]
code-highlight-config = [
    "code-highlight-core",
    "gmark-export/code-highlight-config",
    "gmark-source-tools/code-highlight-config",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-toml",
]
code-highlight-extra = [
    "code-highlight-core",
    "gmark-export/code-highlight-extra",
    "gmark-source-tools/code-highlight-extra",
]

[dependencies]
anyhow = "1"
csv = "1"
tempfile = "=3.27.0"
gmark-document = { path = "crates/gmark-document" }
gmark-document-core = { path = "crates/gmark-document-core" }
gmark-document-runtime = { path = "crates/gmark-document-runtime" }
gmark-config = { path = "crates/gmark-config" }
gmark-export = { path = "crates/gmark-export", default-features = false }
gmark-i18n = { path = "crates/gmark-i18n" }
gmark-json-graph = { path = "crates/gmark-json-graph" }
gmark-markdown = { path = "crates/gmark-markdown", default-features = false }
gmark-math-edit = { path = "crates/gmark-math-edit" }
gmark-paged-document = { package = "gmark-paged-document", path = "crates/gmark-paged-document" }
gmark-recovery-codec = { path = "crates/gmark-recovery-codec" }
gmark-source-tools = { path = "crates/gmark-source-tools", default-features = false }
gmark-update-core = { path = "crates/gmark-update-core" }
base64 = "0.22.1"
uuid = "1.23"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
accesskit = "=0.24.1"
raw-window-handle = "=0.6.2"
unicode-segmentation = "1.13"
unicode_categories = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
schemars = "1"
futures = "0.3"
semver = "1"
toml = "1"
trash = "5.2.6"
chromiumoxide = { version = "0.9.1", default-features = false, features = ["bytes"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
velopack = { version = "=1.2.0", features = ["public-utils"] }
pulldown-cmark = "0.13"
cssparser = "0.37"
ammonia = "=4.1.3"
arboard = "3.6.1"
crc32fast = "1"
directories = "6"
dunce = "1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
ratex-layout = "0.1.9"
ratex-parser = "0.1.9"
ratex-svg = { version = "0.1.9", features = ["embed-fonts", "standalone"] }
mermaid-rs-renderer = { version = "0.3.0", default-features = false }
notify-debouncer-full = "0.7.0"
harper-core = { version = "=2.5.0", default-features = false, features = ["concurrent"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
rayon = "1"
regex = "1"
ignore = "0.4"
image = "=0.25.10"
png = "=0.18.1"
resvg = { version = "=0.45.1", default-features = false }
smallvec = "=1.15.2"
flate2 = "1"
tar = "0.4"
sysinfo = "=0.31.4"
encoding_rs = "0.8"
chardetng = "0.1"
sys-locale = "0.3"
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-highlight = { version = "0.26.9", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-toml = { package = "adot-tree-sitter-toml", version = "0.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
uds_windows = "=1.2.1"
fs4 = { version = "=0.13.1", default-features = false, features = ["sync"] }
accesskit_windows = "=0.34.0"
windows = { version = "=0.62.0", features = ["UI_ViewManagement", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.26.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = { version = "=0.22.1", default-features = false, features = ["async-io"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }
sysinfo = "=0.31.4"
unicode-segmentation = "1.13"

# Cargo auto-discovers each *.rs file in benches/ as its own bench binary.
# Every Criterion bench needs `harness = false` so Cargo doesn't inject the
# libtest harness on top of Criterion's own `main`. The shared helpers live
# in `benches/common/mod.rs` (a subdirectory, so Cargo doesn't compile it as
# yet another bench target).
[[bench]]
name = "theme_arc"
harness = false

[[bench]]
name = "i18n_arc"
harness = false

[[bench]]
name = "build_text_runs"
harness = false

[[bench]]
name = "shared_display_text"
harness = false

[[bench]]
name = "grapheme_cursor"
harness = false

[[bench]]
name = "blink_throttle"
harness = false

[[bench]]
name = "projection_cache"
harness = false

[[bench]]
name = "render_loop"
harness = false

[[bench]]
name = "html_attr_parser"
harness = false

[[bench]]
name = "matches_sequence"
harness = false

[[bench]]
name = "exporter_inline_walker"
harness = false

[[bench]]
name = "borrowed_str_params"
harness = false

[[bench]]
name = "spacing_infos_lazy"
harness = false

[[bench]]
name = "menu_labels_dedup"
harness = false

[[bench]]
name = "table_cells_collect"
harness = false

[[bench]]
name = "os_string_lossy"
harness = false

[[bench]]
name = "known_length_collect"
harness = false

[[bench]]
name = "normalize_reference_label"
harness = false

[[bench]]
name = "font_fallbacks_cache"
harness = false

[[bench]]
name = "json_graph_layout"
harness = false

# Stop Cargo from also linking the libtest bench harness against the bin —
# without this, Criterion-specific CLI flags (`--save-baseline`, etc.) trip
# the libtest stub before Criterion's `main` runs (rust-lang/rust#47241).
[[bin]]
name = "gmark"
path = "src/main.rs"
bench = false

[[bin]]
name = "gmark-update-helper"
path = "src/bin/gmark-update-helper.rs"
bench = false

[[bin]]
name = "gmark-update-agent"
path = "src/bin/gmark-update-agent.rs"
bench = false

[build-dependencies]
embed-resource = "3"

# GPUI 0.2.2 的 Zed util 依赖在 macOS 使用 adopt_raw_pid；必须与同一 Zed
# revision 的 workspace patch 配套，否则干净 runner 会错误解析 crates.io 版本。
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[profile.bench]
# Keep DWARF for samply / perf / cargo flamegraph; doesn't disable opts.
debug = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep our own code in dev (fast incremental compile, debuggable), but
# build the heavy framework/IO crates at release-level optimization so debug
# runs aren't dominated by their per-call overhead. The hot path on every
# render goes through gpui/taffy/text-shaping; without these overrides each
# block in a long document costs hundreds of µs/frame purely from O0 code.
[profile.dev.package]
gpui = { opt-level = 3 }
gpui-macros = { opt-level = 3 }
gpui_http_client = { opt-level = 3 }
gpui_sum_tree = { opt-level = 3 }
gpui_util = { opt-level = 3 }
gpui_util_macros = { opt-level = 3 }
gpui_collections = { opt-level = 3 }
gpui_media = { opt-level = 3 }
gpui_refineable = { opt-level = 3 }
gpui_semantic_version = { opt-level = 3 }
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
zed-font-kit = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
pulldown-cmark = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
tree-sitter-highlight = { opt-level = 3 }
ratex-layout = { opt-level = 3 }
ratex-parser = { opt-level = 3 }
ratex-svg = { opt-level = 3 }
smol = { opt-level = 3 }
async-task = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
lyon = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
etagere = { opt-level = 3 }
image = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }
